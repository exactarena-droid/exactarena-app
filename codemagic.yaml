workflows:
  flutter-ios-workflow:
    name: Exact Arena iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get
      - name: CocoaPods installation
        script: |
          cd ios
          rm -rf Pods Podfile.lock Runner.xcworkspace/xcshareddata
          pod install
      - name: Flutter build iOS
        script: |
          flutter build ios --release --no-codesign --no-pub --build-plugins_and_app
